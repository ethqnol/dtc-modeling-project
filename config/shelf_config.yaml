# Tunable Model Weights for Wire Shelf Label Simulation
# Physical dimensions and fixed SKU lists live in shelf_geometry.yaml.
# Run with overrides via: python3 run_experiments.py --config my_weights.{yaml,json,toon} [--quick]

execution:
  benchmark_replications: 50
  sweep_replications: 25
  search_replications: 6
  composite_score_latency_weight: 0.85

behavioral_weights:
  # Grounded independently in THERP human reliability [6], order-picking ergonomics [5, 7],
  # Fitts's Law [2], retail congestion [3], and Category Adjustment [4].
  # Layout rankings stay stable across handbook ranges because all setups share these weights.
  base_error_rate: 0.028              # Standard 1%-3% routine manual HEP (THERP [6] / picking [7])
  base_correction_rate: 0.24          # 15%-30% incidental anomaly fix rate during active access [3, 6]
  alpha_rush: 2.8                     # 2.6x-3.8x error multiplier at peak rush (THERP time stress [2, 6])
  alpha_crowd: 3.2                    # Fitts's congestion slope past 75%-80% working fill ceiling [2, 3, 5]
  alpha_blur: 1.75                    # Category Adjustment boundary noise slope [3, 4]
  alpha_ergo: 2.3                     # Ergonomic reach/bend strain multiplier across shelf zones [5, 7]
  bin_dump_error_penalty: 0.11        # Added return-slip blur per open wire bin on shelf [4, 7]
  bin_dump_routing_weight: 0.30       # Drop-in attraction pulling rushed slips into wire bins [4, 7]
  mech_diversity_penalty: 0.10        # Cognitive switching load per storage style beyond 2 [7]
  bin_drawer_same_row_penalty: 0.16   # Extra friction when negotiating a bin and drawers in the same row
  drawer_size_mix_penalty: 0.0        # No mechanism penalty when mixing 6in and 9in drawer widths
  multi_sku_slot_penalty: 0.16        # Return-slip & lookup blur per extra SKU sharing one compartment
  slot_deficit_penalty: 1.20          # Organizational blur when total drawer compartments < 48
  row_width_mismatch_penalty: 0.25    # Alignment/layout friction when drawer rows differ in width (42in vs 45in)
  unlatch_rush_prob: 0.38             # Hurried bypass prob * tau leaving pull-down peg row down [6, 7]
  occlusion_friction_penalty: 0.35    # Extra error friction while unlatched peg blocks Mid shelf
  search_miss_penalty_sec: 14.0       # Base search effort multiplier when a roll is missing from home
  usability_accuracy_threshold: 0.80  # 80% accuracy threshold for collapse tracking

demand_weights:
  rush_job_share: 0.45                # Share of shift jobs inside 8:00-10:00 AM batch rush
  rush_tau_range: [0.75, 1.00]        # Urgency tau during rush window
  calm_tau_range: [0.10, 0.35]        # Urgency tau outside rush window
  rush_sku_boost: 3.6                 # Demand multiplier on priority categories during rush
  same_product_co_retrieval: 0.90     # Probability that A/B/C siblings are pulled together

