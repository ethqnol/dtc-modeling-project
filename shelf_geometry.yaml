# Physical wire shelf geometry and fixed shift schedule definitions.
# Tunable model weights live in shelf_config.yaml.

geometry:
  shelf_width_cm: 120.0
  shelf_depth_cm: 60.0
  shelf_row_height_cm: 60.0
  eye_level_height_cm: 140.0
  mid_level_height_cm: 80.0
  bottom_level_height_cm: 25.0
  top_overhead_height_cm: 195.0
  wire_bins_per_full_row: 2
  drawers_per_full_row: 7
  drawers_per_half_bay: 4
  drawer_outer_width_cm: 17.1
  drawer_outer_depth_cm: 60.0
  drawer_outer_height_cm: 30.0
  wire_bin_bay_width_cm: 51.4
  wire_bin_bay_depth_cm: 60.0
  wire_bin_bay_height_cm: 60.0
  wire_bin_subzones: 4
  wire_bin_subzone_hard_cap: 9
  drawer_count: 7
  partitions_per_drawer: 4
  drawer_inner_width_cm: 15.6
  drawer_inner_depth_cm: 58.0
  drawer_inner_height_cm: 27.0
  partition_divider_thickness_cm: 0.4
  wire_bin_width_cm: 25.0
  wire_bin_depth_cm: 58.0
  wire_bin_height_cm: 58.0
  wire_bin_max_rolls: 10
  peg_rows: 8
  pegs_per_row: 4
  peg_usable_length_cm: 25.0
  peg_horizontal_spacing_cm: 15.0
  peg_pull_down_drop_cm: 35.0

