[workspace]
authors = ["ethqnol <drinkfood.exe@gmail.com>"]
channels = [
  { channel = "https://conda.modular.com/max-nightly", exclude-newer = "2026-09-21T12:00:00Z" },
  "https://conda.modular.com/max",
  "conda-forge",
]
name = "dtc-simulation"
platforms = ['linux-64']
preview = ["pixi-build"]
version = "0.1.0"

[tasks]
test = "mojo run -I . tests/test_simulation.mojo"
build = "mojo build -I . run_experiments.mojo -o run_experiments"
run = "mojo build -I . run_experiments.mojo -o run_experiments && ./run_experiments"
quick = "mojo run -I . run_experiments.mojo --quick"

[dependencies]
mojo = ">=1.2.0.dev2026092105,<2"
python = ">=3.14.10,<3.15"
pyyaml = ">=6.0.3,<7"
dataviz_mojo = { git = "https://github.com/randyzwitch/dataviz_mojo.git", tag = "v0.15.0" }
